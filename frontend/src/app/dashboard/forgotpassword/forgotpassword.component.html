<div class="auth-page page-enter">
  <div class="auth-media" aria-hidden="true">
    <div class="auth-media-overlay"></div>
    <div class="auth-brand">
      <img src="../../../assets/images/frontal-taxi-cab.png" alt="" class="auth-logo">
      <span>Eber Ride</span>
    </div>
  </div>

  <div class="auth-panel">
    <div class="auth-form">
      <p class="auth-eyebrow">Account recovery</p>
      <h1>Forgot password</h1>
      <p class="auth-sub">Enter your email and we’ll send reset instructions when this feature is ready.</p>

      <form id="createForm" autocomplete="off">
        <label>Email</label>
        <input type="email" class="form-control" placeholder="Work in progress...">

        <button type="submit" class="btn btn-primary w-100 auth-submit" id="submitBtn">Reset Password</button>

        <div id="forgotDiv" class="auth-links">
          <a routerLinkActive="active" routerLink="/login">Back to login</a>
          <span>or</span>
          <a routerLinkActive="active" routerLink="/signup">Sign up</a>
        </div>
      </form>
    </div>
  </div>
</div>
