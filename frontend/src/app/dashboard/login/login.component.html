<div class="auth-page page-enter">
  <div class="auth-media" aria-hidden="true">
    <div class="auth-media-overlay"></div>
    <div class="auth-brand">
      <img src="../../../assets/images/frontal-taxi-cab.png" alt="" class="auth-logo">
      <span>Eber Ride</span>
    </div>
  </div>

  <div class="auth-panel">
    <form id="createForm" [formGroup]="loginForm" (ngSubmit)="onLogin()" class="auth-form">
      <p class="auth-eyebrow">Welcome back</p>
      <h1>Sign in to Eber Ride</h1>
      <p class="auth-sub">Manage bookings, drivers, and rides from one smooth dashboard.</p>

      <label for="username">Email</label>
      <input
        id="username"
        type="email"
        class="form-control"
        placeholder="you@example.com"
        formControlName="email"
        [class.is-invalid]="loginForm.get('email')?.invalid && (loginForm.get('email')?.touched || loginForm.get('email')?.dirty)"
      />
      <div
        *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.touched || loginForm.get('email')?.dirty)"
        class="invalid-feedback d-block"
      >
        <div *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</div>
        <div *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email.</div>
      </div>

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        class="form-control"
        placeholder="Your password"
        formControlName="password"
        [class.is-invalid]="loginForm.controls['password'].invalid && (loginForm.controls['password'].touched || loginForm.controls['password'].dirty)"
      />
      <div
        *ngIf="loginForm.controls['password'].invalid && (loginForm.controls['password'].touched || loginForm.controls['password'].dirty)"
        class="invalid-feedback d-block"
      >
        Password is required.
      </div>

      <button type="submit" class="btn btn-primary w-100 auth-submit" id="submitBtn">Log In</button>

      <div id="forgotDiv" class="auth-links">
        <a routerLinkActive="active" routerLink="/forgotpassword">Forgot password?</a>
        <span>or</span>
        <a routerLinkActive="active" routerLink="/signup">Create account</a>
      </div>

      <div class="social">
        <button type="button" class="social-btn" disabled>
          <img src="../../../assets/images/google" alt="" class="googleimg"> Google
        </button>
        <button type="button" class="social-btn" disabled>
          <img src="../../../assets/images/apple-logo-transparent.png" alt="" class="appleimg"> Apple
        </button>
      </div>
    </form>
  </div>
</div>
